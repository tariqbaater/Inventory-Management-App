name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code inside container
        run: |
          docker exec inventory-management-dukan-vhhgqi.1.b07vbwnoefjcpig0mumekatc0 git pull origin main

      - name: Install dependencies (if needed)
        run: |
          docker exec inventory-management-dukan-vhhgqi.1.b07vbwnoefjcpig0mumekatc0 npm install

      - name: Restart app process
        run: |
          docker restart inventory-management-dukan-vhhgqi.1.b07vbwnoefjcpig0mumekatc0
